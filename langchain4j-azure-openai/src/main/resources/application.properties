# Azure OpenAI 配置
langchain4j.azure.openai.api-key=YOUR_API_KEY
langchain4j.azure.openai.endpoint=YOUR_ENDPOINT
langchain4j.azure.openai.chat.options.model=gpt-35-turbo
langchain4j.azure.openai.chat.options.temperature=0.7
# Server 配置
server.port=8080
################################################################################################################
###logging (log4j2) 基本配置：
###http://www.cnblogs.com/yhtboke/p/Mybatis.html
################################################################################################################
logging.config=classpath:conf/log4j2-dev.xml
