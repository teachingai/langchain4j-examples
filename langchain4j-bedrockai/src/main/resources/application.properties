# Bedrock AI 配置
# For authentication, set the following environment variables:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
langchain4j.bedrock.region=us-east-1
langchain4j.bedrock.chat.options.model=anthropic.claude-3-sonnet-20240229-v1:0
langchain4j.bedrock.chat.options.temperature=0.7
langchain4j.bedrock.chat.options.max-tokens=300
# Server 配置
server.port=8080
