# Vertex AI 配置
langchain4j.vertex-ai.endpoint=us-central1-aiplatform.googleapis.com:443
langchain4j.vertex-ai.project=${GOOGLE_CLOUD_PROJECT}
langchain4j.vertex-ai.location=us-central1
langchain4j.vertex-ai.publisher=google
langchain4j.vertex-ai.chat.options.model=chat-bison@001
langchain4j.vertex-ai.chat.options.temperature=0.7
# JDBC 配置
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
# Server 配置
server.port=8080
